name: Verify MonumentStudio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SERVER: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check local documentation links
        run: node scripts/check-doc-links.mjs

      - name: Check strict TypeScript
        run: npm run typecheck

      - name: Test geometry, validation, and persistence
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install browser engines and system libraries
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test production workflows and accessibility
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Unpatched development-only braces advisory: docs/DEPENDENCY_SECURITY.md.
      # Keep the result visible without forcing an incompatible Next.js downgrade.
      - name: Report full dependency audit
        id: development-audit
        continue-on-error: true
        run: npm audit

      - name: Flag dependency audit findings
        if: steps.development-audit.outcome == 'failure'
        run: echo "::warning::The full dependency audit did not pass. Review its output and the documented development-tool advisory; this run does not establish a vulnerability-free repository."

      - name: Retain browser verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
